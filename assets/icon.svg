<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Haute Midnight Caviar Void -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Haute Champagne Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf7ea" />
      <stop offset="25%" stop-color="#f2dcaa" />
      <stop offset="60%" stop-color="#dab978" />
      <stop offset="85%" stop-color="#b88f42" />
      <stop offset="100%" stop-color="#7d5c20" />
    </linearGradient>

    <!-- Haute Liquid Titanium & Platinum -->
    <linearGradient id="valyrianSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ece4" />
      <stop offset="40%" stop-color="#b5ad9e" />
      <stop offset="75%" stop-color="#635b50" />
      <stop offset="100%" stop-color="#25211c" />
    </linearGradient>

    <!-- Gilded Champagne Border Trim -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2dcaa" />
      <stop offset="50%" stop-color="#a88337" />
      <stop offset="100%" stop-color="#dab978" />
    </linearGradient>

    <!-- Radial Champagne Aura Glow -->
    <radialGradient id="centerGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dab978" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8b1e2f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Ancient Inscriptions -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Imperial Gilded Filigree Rim -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.75" />
  <rect width="480" height="480" x="16" y="16" rx="104" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6,4" />

  <!-- Center Ancient Radial Aura -->
  <circle cx="256" cy="256" r="215" fill="url(#centerGoldGlow)" />

  <!-- Outer Crown / Sunburst Halo Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldMetallic)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4,8" />

  <!-- 1. The Ancient Valyrian Heavy Dumbbell / Mace Scepter -->
  <g transform="translate(256, 256) rotate(-30) translate(-256, -256)">
    <!-- Left Iron Plates -->
    <path d="M 100 176 L 148 144 L 148 368 L 100 336 Z" fill="url(#valyrianSteel)" stroke="url(#goldBorder)" stroke-width="2" />
    <path d="M 128 158 L 168 132 L 168 380 L 128 354 Z" fill="url(#goldMetallic)" />

    <!-- Right Iron Plates -->
    <path d="M 384 132 L 344 158 L 344 354 L 384 380 Z" fill="url(#goldMetallic)" />
    <path d="M 412 144 L 364 176 L 364 336 L 412 368 Z" fill="url(#valyrianSteel)" stroke="url(#goldBorder)" stroke-width="2" />

    <!-- Solid Cast Gold Knurled Bar -->
    <rect x="164" y="238" width="184" height="36" rx="6" fill="url(#valyrianSteel)" stroke="url(#goldBorder)" stroke-width="3" />
    <line x1="216" y1="238" x2="216" y2="274" stroke="url(#goldMetallic)" stroke-width="4" />
    <line x1="236" y1="238" x2="236" y2="274" stroke="url(#goldMetallic)" stroke-width="4" />
    <line x1="276" y1="238" x2="276" y2="274" stroke="url(#goldMetallic)" stroke-width="4" />
    <line x1="296" y1="238" x2="296" y2="274" stroke="url(#goldMetallic)" stroke-width="4" />
  </g>

  <!-- 2. Royal Crest Ancient Cardiogram Pulse (Gilded Heartbeat of Valyria) -->
  <path d="M 64 280 L 152 280 L 195 345 L 245 155 L 285 375 L 325 240 L 362 280 L 448 280" 
        fill="none" 
        stroke="url(#goldMetallic)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#royalGlow)" />

  <!-- 3. Sigil of Iron & Fire: Imperial Golden Dragon Thunder Bolt -->
  <path d="M 296 42 
           L 182 254 
           L 264 254 
           L 218 470 
           L 364 212 
           L 276 212 
           Z" 
        fill="url(#goldMetallic)" 
        stroke="#fffbe8" 
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#royalGlow)" />

  <!-- Sacred Inner Diamond Sparkle -->
  <polygon points="270,218 238,254 262,254 242,324 294,232 268,232" fill="#ffffff" opacity="0.85" />
</svg>
